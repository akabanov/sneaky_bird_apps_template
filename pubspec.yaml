name: birdcorner_app_template
description: "New BirdCorner App"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  go_router: ^14.6.2
  intl: any
  json_annotation: ^4.9.0
  onesignal_flutter: ^5.3.3
  permission_handler: ^11.3.1
  sentry_flutter: ^9.27.0
  shorebird_code_push: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  build_runner: ^2.4.14
  freezed: ^3.2.3
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  golden_toolkit: ^0.15.0
  device_frame: ^1.2.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3
  image: ^4.5.4
  sentry_dart_plugin: ^3.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/dev/Roboto-Regular.ttf

sentry:
  symbols_path: build/app/outputs/symbols
